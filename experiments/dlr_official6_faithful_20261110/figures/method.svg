<g stroke="#d08a1e" stroke-width="1" stroke-dasharray="3 2"><line x1="367" y1="222" x2="367" y2="240"/><line x1="463" y1="222" x2="463" y2="240"/><line x1="559" y1="222" x2="559" y2="240"/></g>
<text x="24" y="292" font-size="11" fill="#33598a">Deployed: blue + orange only (SAR and DEM in, no optical)</text>
