<rect x="366" y="56" width="130" height="44" rx="6" fill="#e7f2df" stroke="#7aa35a"/>
<text x="431" y="74" font-size="12" fill="#2f5119" text-anchor="middle">Teacher features</text>
<text x="431" y="90" font-size="11" fill="#4f7a33" text-anchor="middle">decoder stage 2</text>
<line x1="156" y1="78" x2="184" y2="78" stroke="#444" stroke-width="1" marker-end="url(#ah)"/>
<line x1="336" y1="78" x2="364" y2="78" stroke="#444" stroke-width="1" marker-end="url(#ah)"/>

