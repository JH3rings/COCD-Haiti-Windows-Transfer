<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 570" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Scale- and event-shared prototypes with cross-event Wasserstein relation distillation</title>
<desc>(a) A frozen optical-SAR teacher is used only in training; the SAR student U-Net has one prototype bank shared by decoder stages 2-4 (32, 64, 128 px) and by all events, trained with segmentation loss and a cross-event Wasserstein relation loss. (b) The prototype module. (c) The loss compares the sorted similarities of a region to regions of other events.</desc>
