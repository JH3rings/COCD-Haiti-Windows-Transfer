<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">Counter-guided target evidence search teacher and target-only student</title>
<desc id="desc">The counter orbit affects only the teacher search policy. Retrieved evidence and decoder values are from target memory. A target-only student distills the policy and target evidence.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
  <marker id="kdarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8b5cf6"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:31px;font-weight:700}.section{font-size:22px;font-weight:700;letter-spacing:.4px}.box{stroke:#334155;stroke-width:2.2;rx:12}.label{font-size:18px;font-weight:600}.small{font-size:15px}.tiny{font-size:13px}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.kd{fill:none;stroke:#8b5cf6;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#kdarrow)}
  </style>
</defs>
<rect width="1600" height="940" fill="#fff"/>
<text x="800" y="52" text-anchor="middle" class="title">Counter-Guided Target Evidence Search → Target-Only Student</text>

<!-- teacher -->
<rect x="40" y="82" width="1520" height="385" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="120" class="section">TRAINING-TIME TEACHER  ·  target + counter available</text>
<rect class="box" x="70" y="165" width="205" height="76" fill="#dbeafe"/><text x="172" y="195" text-anchor="middle" class="label">Target orbit</text><text x="172" y="220" text-anchor="middle" class="small">pre/post VV, VH</text>
<rect class="box" x="70" y="325" width="205" height="76" fill="#fee2e2"/><text x="172" y="355" text-anchor="middle" class="label">Counter orbit</text><text x="172" y="380" text-anchor="middle" class="small">opposite-orbit SAR</text>
<rect class="box" x="340" y="165" width="240" height="76" fill="#bfdbfe"/><text x="460" y="195" text-anchor="middle" class="label">Target encoder</text><text x="460" y="220" text-anchor="middle" class="small">target FPN features</text>
<rect class="box" x="340" y="325" width="240" height="76" fill="#fecaca"/><text x="460" y="355" text-anchor="middle" class="label">Counter encoder / context</text><text x="460" y="380" text-anchor="middle" class="small">policy context only</text>
<path class="line" d="M275 203 H336"/><path class="line" d="M275 363 H336"/>
<rect class="box" x="650" y="298" width="265" height="96" fill="#ede9fe"/><text x="782" y="330" text-anchor="middle" class="label">Counter-Guided</text><text x="782" y="356" text-anchor="middle" class="label">Search Policy</text><text x="782" y="380" text-anchor="middle" class="tiny">offsets + normalized weights</text>
<path class="line" d="M580 363 H646"/>
<rect class="box" x="650" y="155" width="265" height="82" fill="#dbeafe"/><text x="782" y="189" text-anchor="middle" class="label">Target memory only</text><text x="782" y="215" text-anchor="middle" class="small">projected target FPN values</text>
<path class="line" d="M580 203 H646"/>
<rect class="box" x="1000" y="222" width="245" height="100" fill="#e0f2fe"/><text x="1122" y="260" text-anchor="middle" class="label">Search(target memory,</text><text x="1122" y="286" text-anchor="middle" class="label">teacher policy)</text><text x="1122" y="309" text-anchor="middle" class="tiny">target-side retrieval</text>
<path class="line" d="M915 203 C960 203 955 254 996 262"/><path class="line" d="M915 353 C960 353 955 290 996 282"/>
<rect class="box" x="1300" y="165" width="220" height="76" fill="#bbf7d0"/><text x="1410" y="195" text-anchor="middle" class="label">Retrieved evidence</text><text x="1410" y="220" text-anchor="middle" class="small">from target values</text>
<rect class="box" x="1300" y="310" width="220" height="76" fill="#fef3c7"/><text x="1410" y="340" text-anchor="middle" class="label">Decoder → teacher</text><text x="1410" y="365" text-anchor="middle" class="small">segmentation output</text>
<path class="line" d="M1245 272 H1296"/><path class="line" d="M1410 241 V306"/>
<rect x="945" y="132" width="330" height="47" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="1110" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#be123c">COUNTER VALUES DO NOT ENTER DECODER</text>

<!-- student -->
<rect x="40" y="500" width="1520" height="310" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="540" class="section">DEPLOYMENT-TIME STUDENT  ·  target orbit only</text>
<rect class="box" x="70" y="615" width="205" height="76" fill="#dbeafe"/><text x="172" y="645" text-anchor="middle" class="label">Target orbit</text><text x="172" y="670" text-anchor="middle" class="small">single-orbit input</text>
<rect class="box" x="340" y="615" width="240" height="76" fill="#bfdbfe"/><text x="460" y="645" text-anchor="middle" class="label">Student encoder</text><text x="460" y="670" text-anchor="middle" class="small">target memory + context</text>
<path class="line" d="M275 653 H336"/>
<rect class="box" x="650" y="588" width="265" height="76" fill="#ede9fe"/><text x="782" y="620" text-anchor="middle" class="label">Student search policy</text><text x="782" y="646" text-anchor="middle" class="small">target-only offsets + weights</text>
<rect class="box" x="650" y="690" width="265" height="76" fill="#dbeafe"/><text x="782" y="722" text-anchor="middle" class="label">Student target memory</text><text x="782" y="748" text-anchor="middle" class="small">values used for retrieval</text>
<path class="line" d="M580 653 H646"/><path class="line" d="M580 653 C620 653 615 728 646 728"/>
<rect class="box" x="1000" y="638" width="245" height="92" fill="#e0f2fe"/><text x="1122" y="673" text-anchor="middle" class="label">Search(student memory,</text><text x="1122" y="699" text-anchor="middle" class="label">student policy)</text><text x="1122" y="720" text-anchor="middle" class="tiny">target-side evidence</text>
<path class="line" d="M915 626 C960 626 955 668 996 676"/><path class="line" d="M915 728 C960 728 955 694 996 690"/>
<rect class="box" x="1300" y="646" width="220" height="76" fill="#fef3c7"/><text x="1410" y="676" text-anchor="middle" class="label">Decoder → prediction</text><text x="1410" y="701" text-anchor="middle" class="small">target-only inference</text>
<path class="line" d="M1245 684 H1296"/>

<!-- distillation links -->
<path class="kd" d="M782 394 C782 440 783 450 783 584"/><text x="804" y="480" class="small" fill="#6d28d9">Policy distillation</text>
<path class="kd" d="M1300 203 H1275 V455 C1275 530 1122 545 1122 634"/><text x="1222" y="508" class="small" fill="#6d28d9">Same-target-memory evidence distillation</text>

<!-- schedule -->
<text x="70" y="867" class="small" font-weight="700">Training schedule</text>
<rect x="250" y="838" width="350" height="55" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="425" y="872" text-anchor="middle" class="label">Segmentation warm-up</text>
<path class="line" d="M600 865 H695"/>
<rect x="700" y="838" width="480" height="55" rx="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="940" y="872" text-anchor="middle" class="label">Search-KD with decay</text>
<text x="1215" y="871" class="small">No counter input at deployment</text>
</svg>
